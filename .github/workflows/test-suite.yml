name: TimeLocker Test Suite

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  COVERAGE_THRESHOLD: 50

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path:         ~/.cache/pip
          key:          ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
                        ${{ runner.os }}-pip-

      - name: Install system dependencies (Ubuntu)
        if:   matrix.os == 'ubuntu-latest'
        run:  |
              sudo apt-get update
              # Install restic 0.18.0 or later (Ubuntu repos have older version)
              RESTIC_VERSION="0.18.0"
              wget https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2
              bunzip2 restic_${RESTIC_VERSION}_linux_amd64.bz2
              sudo mv restic_${RESTIC_VERSION}_linux_amd64 /usr/local/bin/restic
              sudo chmod +x /usr/local/bin/restic
              restic version

      - name: Install system dependencies (macOS)
        if:   matrix.os == 'macos-latest'
        run:  |
              brew install restic

      - name: Install system dependencies (Windows)
        if:   matrix.os == 'windows-latest'
        run:  |
              choco install restic

      - name: Install Python dependencies
        run:  |
              python -m pip install --upgrade pip
              pip install -e .[dev]

      - name: Run tests with coverage
        env:
          PYTHONPATH: src
        run: python -m pytest -m "not performance and not stress and not minio"

      - name: Upload coverage reports to Codecov
        if:   matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          token:            ${{ secrets.CODECOV_TOKEN }}
          files:            ./coverage.xml
          flags:            unittests
          name:             codecov-umbrella
          fail_ci_if_error: false

      - name: Archive test results
        if:   always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
                htmlcov/
                .coverage
                coverage.xml

  minio-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      MINIO_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_S3_ENDPOINT: http://127.0.0.1:9000
      MINIO_ACCESS_KEY: timelocker-ci
      MINIO_SECRET_KEY: timelocker-ci-secret
      MINIO_BUCKET: timelocker-test
      MINIO_REGION: us-east-1
      MINIO_VERIFY_SSL: "false"
      AWS_DEFAULT_REGION: us-east-1
      TIMELOCKER_LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Restic
        run: |
          RESTIC_VERSION="0.18.0"
          wget https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2
          bunzip2 restic_${RESTIC_VERSION}_linux_amd64.bz2
          sudo mv restic_${RESTIC_VERSION}_linux_amd64 /usr/local/bin/restic
          sudo chmod +x /usr/local/bin/restic
          restic version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Start ephemeral MinIO
        run: |
          docker run --detach --rm \
            --name timelocker-minio \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data --address :9000

      - name: Wait for MinIO and create test bucket
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "$MINIO_ENDPOINT_URL/minio/health/live" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::MinIO profile dependency error: service did not become ready within 30 seconds"
              docker logs timelocker-minio
              exit 1
            fi
            sleep 1
          done
          python - <<'PY'
          import os

          import boto3
          from botocore.config import Config

          client = boto3.client(
              "s3",
              endpoint_url=os.environ["MINIO_ENDPOINT_URL"],
              aws_access_key_id=os.environ["MINIO_ACCESS_KEY"],
              aws_secret_access_key=os.environ["MINIO_SECRET_KEY"],
              region_name=os.environ["MINIO_REGION"],
              config=Config(s3={"addressing_style": "path"}),
          )
          bucket = os.environ["MINIO_BUCKET"]
          existing = {item["Name"] for item in client.list_buckets()["Buckets"]}
          if bucket not in existing:
              client.create_bucket(Bucket=bucket)
          print(f"MinIO dependency ready; bucket '{bucket}' is available")
          PY

      - name: Run live MinIO profile
        run: python -m pytest -m minio --no-cov

      - name: Stop ephemeral MinIO
        if: always()
        run: docker rm --force timelocker-minio || true

  extended-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run performance and stress tests without coverage instrumentation
        env:
          PYTHONPATH: src
        run: python -m pytest -m "performance or stress" --no-cov


  quality-gate:
    runs-on: ubuntu-latest
    needs: [test, minio-test]
    permissions:
      contents:      read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run:  |
              python -m pip install --upgrade pip
              pip install -e .[dev]

      - name:              Download test artifacts
        uses:              actions/download-artifact@v4
        with:
          name: test-results-ubuntu-latest-3.12

      - name: Check coverage threshold
        run:  |
              pip install coverage
              test -f coverage.xml
              test -f .coverage
              coverage report --fail-under=${{ env.COVERAGE_THRESHOLD }}

      - name: Generate quality report
        run:  |
              python -c "
              import json
              import xml.etree.ElementTree as ET
              import os
              from datetime import datetime

              # Parse coverage XML
              try:
                  if os.path.exists('coverage.xml'):
                      tree = ET.parse('coverage.xml')
                      root = tree.getroot()
                      coverage = float(root.get('line-rate', 0)) * 100
                  else:
                      coverage = 0
                      print('No coverage.xml found, setting coverage to 0%')
              except Exception as e:
                  print(f'Error parsing coverage.xml: {e}')
                  coverage = 0

              # Create quality report
              quality_report = {
                  'coverage_percentage': coverage,
                  'coverage_threshold': 50,
                  'coverage_passed': coverage >= 50,
                  'timestamp': datetime.utcnow().isoformat() + 'Z'
              }

              with open('quality-report.json', 'w') as f:
                  json.dump(quality_report, f, indent=2)

              print(f'Coverage: {coverage:.1f}%')
              print(f'Threshold: 50%')
              print(f'Passed: {coverage >= 50}')
              "

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: quality-report.json

      - name: Comment PR with results
        if:   github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
                  const fs = require('fs');

                  try {
                    const qualityReport = JSON.parse(fs.readFileSync('quality-report.json', 'utf8'));

                    const comment = `## 🧪 Test Results

                    | Metric | Value | Status |
                    |--------|-------|--------|
                    | Coverage | ${qualityReport.coverage_percentage.toFixed(1)}% | ${qualityReport.coverage_passed ? '✅' : '❌'} |
                    | Threshold | ${qualityReport.coverage_threshold}% | - |

                    ${qualityReport.coverage_passed ?
                      '✅ All quality gates passed!' :
                      '❌ Quality gates failed. Please improve test coverage to meet the threshold.'}
                    `;

                    github.rest.issues.createComment({
                      issue_number: context.issue.number,
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      body: comment
                    });
                  } catch (error) {
                    console.log('Could not create PR comment:', error);
                  }

  notify:
    runs-on: ubuntu-latest
    needs: [test, minio-test, quality-gate]
    if:      always()
    permissions:
      contents: read
    steps:
      - name: Notify on success
        if:   needs.test.result == 'success' && needs.minio-test.result == 'success' && needs.quality-gate.result == 'success'
        run:  |
              echo "✅ All tests passed and quality gates met!"

      - name: Notify on failure
        if:   needs.test.result != 'success' || needs.minio-test.result != 'success' || needs.quality-gate.result != 'success'
        run:  |
              echo "❌ Tests failed or quality gates not met!"
              exit 1
