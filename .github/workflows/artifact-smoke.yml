name: Release Artifact Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build once and inspect artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python scripts/validate_release_artifacts.py --expected-version 0.9.1
      - name: Upload immutable artifact set
        uses: actions/upload-artifact@v4
        with:
          name: timelocker-0.9.1-distributions
          path: dist/
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
        artifact: [wheel, sdist]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout smoke tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: timelocker-0.9.1-distributions
          path: dist
      - name: Select artifact
        id: artifact
        shell: python
        run: |
          from pathlib import Path
          import os

          suffix = ".whl" if "${{ matrix.artifact }}" == "wheel" else ".tar.gz"
          matches = list(Path("dist").glob(f"*{suffix}"))
          if len(matches) != 1:
              raise SystemExit(f"Expected one {suffix} artifact, found {matches}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"path={matches[0]}\n")
      - name: Install and smoke ${{ matrix.artifact }}
        run: >-
          python scripts/smoke_release_artifact.py
          "${{ steps.artifact.outputs.path }}"
          --expected-version 0.9.1
