name: TimeLocker Release Validation

on:
  workflow_call:
    inputs:
      version_ref:
        description: Semantic release reference to validate
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version_ref:
        description: Semantic release reference to rehearse without publishing
        required: true
        default: v0.9.1
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VERSION_REF: ${{ inputs.version_ref }}

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Restic 0.18.0
        shell: bash
        run: |
          set -euo pipefail
          restic_version="0.18.0"
          wget --quiet "https://github.com/restic/restic/releases/download/v${restic_version}/restic_${restic_version}_linux_amd64.bz2"
          wget --quiet "https://github.com/restic/restic/releases/download/v${restic_version}/SHA256SUMS"
          grep "  restic_${restic_version}_linux_amd64.bz2$" SHA256SUMS | sha256sum --check --strict
          bunzip2 "restic_${restic_version}_linux_amd64.bz2"
          sudo install -m 0755 "restic_${restic_version}_linux_amd64" /usr/local/bin/restic
          restic version

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e '.[dev]'

      - name: Verify release intent and workflow boundary
        run: |
          python scripts/validate_release_intent.py --version-ref "$VERSION_REF"
          python scripts/validate_release_workflows.py

      - name: Run required test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -m "not performance and not stress and not minio"

      - name: Build and validate distributions
        run: |
          python -m build
          python scripts/validate_release_artifacts.py --expected-version "${VERSION_REF#v}"

      - name: Smoke wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail
          python scripts/smoke_release_artifact.py dist/*.whl --expected-version "${VERSION_REF#v}"
          python scripts/smoke_release_artifact.py dist/*.tar.gz --expected-version "${VERSION_REF#v}"

      - name: Derive release notes from changelog
        run: >-
          python scripts/extract_release_notes.py
          --version "${VERSION_REF#v}"
          --output release-notes.md

      - name: Upload validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: timelocker-distributions-${{ inputs.version_ref }}
          path: dist/*
          if-no-files-found: error

      - name: Upload release-note preview
        uses: actions/upload-artifact@v4
        with:
          name: timelocker-release-notes-${{ inputs.version_ref }}
          path: release-notes.md
          if-no-files-found: error
