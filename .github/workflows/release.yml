name: TimeLocker Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/release-validation.yml
    with:
      version_ref: ${{ github.ref_name }}

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: timelocker-distributions-${{ github.ref_name }}
          path: dist

      - name: Download derived release notes
        uses: actions/download-artifact@v4
        with:
          name: timelocker-release-notes-${{ github.ref_name }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --notes-file release-notes.md \
            --title "TimeLocker $GITHUB_REF_NAME"
