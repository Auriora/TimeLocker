name: TimeLocker Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Restic 0.18.0
        shell: bash
        run: |
          set -euo pipefail
          restic_version="0.18.0"
          wget --quiet "https://github.com/restic/restic/releases/download/v${restic_version}/restic_${restic_version}_linux_amd64.bz2"
          wget --quiet "https://github.com/restic/restic/releases/download/v${restic_version}/SHA256SUMS"
          grep "  restic_${restic_version}_linux_amd64.bz2$" SHA256SUMS | sha256sum --check --strict
          bunzip2 "restic_${restic_version}_linux_amd64.bz2"
          sudo install -m 0755 "restic_${restic_version}_linux_amd64" /usr/local/bin/restic
          restic version

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e '.[dev]'

      - name: Verify tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import tomllib

          from TimeLocker import __version__

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v"):
              raise SystemExit(f"Release tag must start with v: {tag}")

          tag_version = tag[1:]
          with open("pyproject.toml", "rb") as pyproject_file:
              package_version = tomllib.load(pyproject_file)["project"]["version"]

          if tag_version != package_version or package_version != __version__:
              raise SystemExit(
                  "Version mismatch: "
                  f"tag={tag_version}, pyproject={package_version}, package={__version__}"
              )

          print(f"Version verified: {package_version}")
          PY

      - name: Run required test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -m "not performance and not stress"

      - name: Build source and wheel distributions
        run: |
          python -m build
          sha256sum dist/* > dist/SHA256SUMS

      - name: Smoke test the built wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/timelocker-release-smoke
          /tmp/timelocker-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/timelocker-release-smoke/bin/python -m pip install dist/*.whl
          installed_version=$(/tmp/timelocker-release-smoke/bin/tl version --short)
          test "$installed_version" = "${GITHUB_REF_NAME#v}"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: timelocker-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "TimeLocker $GITHUB_REF_NAME"
