schemaVersion: 2.0.0
metadata:
  name: python-restic
components:
  - name: dev
    container:
      image: public.ecr.aws/aws-mde/universal-image:latest
commands:
  - id: install
    exec:
      component: dev
      commandLine: "pip install ."
  - id: build
    exec:
      component: dev
      commandLine: "pip install -e .[dev]"
  - id: test
    exec:
      component: dev
      commandLine: "python -m pytest"